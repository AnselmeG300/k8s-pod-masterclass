apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      # --- Advanced Pod Configuration ---
      # Delai de grace : temps laisse au conteneur pour traiter le SIGTERM
      # (arret propre) avant le SIGKILL.
      terminationGracePeriodSeconds: 30
      # securityContext au niveau du Pod : tout tourne en non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # --- Scheduling (optionnel, decommenter pour forcer un placement) ---
      # nodeSelector:
      #   kubernetes.io/os: linux

      # --- Init Containers ---
      initContainers:
        # 1) Init classique : bloque tant que Postgres ne repond pas.
        #    Sans lui, l'API demarrerait, echouerait sur la connexion,
        #    et boucler ait en CrashLoopBackOff.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z postgres 5432; do echo "en attente de la base..."; sleep 2; done; echo "base prete"'

        # 2) Sidecar natif : un init container avec restartPolicy Always.
        #    Il demarre AVANT l'app, tourne EN PARALLELE, s'arrete APRES.
        #    Necessite Kubernetes 1.29+.
        #    Role : suivre le fichier de log ecrit par l'API et le pousser
        #    sur la sortie standard.
        - name: log-shipper
          image: busybox:1.36
          restartPolicy: Always
          command:
            - sh
            - -c
            - 'touch /var/log/app/app.log; tail -F /var/log/app/app.log'
          volumeMounts:
            - name: logs
              mountPath: /var/log/app

      # --- Conteneur principal ---
      containers:
        - name: api
          image: demo-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: demo-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: demo-db, key: password }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: demo-db, key: dbname }
            # --- Downward API ---
            # Le kubelet injecte les metadonnees du Pod dans l'app.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # --- QoS Class : Burstable (requests < limits) ---
          # L'API encaisse les pics sans etre sur-reservee.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }

          # securityContext au niveau du conteneur.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # --- Les trois probes, trois roles distincts ---
          # Startup : protege le demarrage lent. Tant qu'elle echoue,
          # liveness et readiness sont suspendues.
          startupProbe:
            httpGet: { path: /startupz, port: 8000 }
            periodSeconds: 3
            failureThreshold: 20    # jusqu'a 60s pour demarrer

          # Liveness : redemarre le conteneur s'il est fige.
          # Ne teste PAS la base : une base coupee ne doit pas
          # provoquer de redemarrage.
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3

          # Readiness : sort le Pod des endpoints du Service si le
          # warm-up n'est pas fini OU si la base est injoignable.
          # Le Pod n'est pas tue, il est juste retire du trafic.
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: logs
              mountPath: /var/log/app
            - name: tmp
              mountPath: /tmp

      volumes:
        # emptyDir partage entre l'API (qui ecrit) et le sidecar (qui lit).
        - name: logs
          emptyDir: {}
        # tmp inscriptible, puisque le rootfs est en lecture seule.
        - name: tmp
          emptyDir: {}
